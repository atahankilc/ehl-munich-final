[project]
name = "bmw-req"
version = "0.1.0"
description = "AI-assisted, evidence-linked customer requirements for BMW successor vehicles (hackathon)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai",
    "httpx",
    "numpy",
    "sqlite-vec",
    "pydantic",
    "python-dotenv",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.9.1",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
    "pgvector>=0.5.1",
]

[project.scripts]
successor = "api.main:run"

[dependency-groups]
dev = ["pytest"]
# docs/pitch/build_pptx.py only: `uv sync --group pitch`
pitch = ["python-pptx", "pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/bmw_req", "src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

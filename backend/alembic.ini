# Alembic (D-059): versioned schema migrations for PostgreSQL. Raw SQL, no ORM.
# `uv run alembic upgrade head` (or `make migrate` from the repo root). The URL comes from DATABASE_URL in .env;
# `-x url=postgresql://…` overrides it (tests).
[alembic]
script_location = migrations
prepend_sys_path = src:.
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s

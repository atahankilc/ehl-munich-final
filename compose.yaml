# SharkSight in containers (D-053). Pick a profile:
#   docker compose --profile prod up -d --build   → http://127.0.0.1:8600 (one container, built app)
#   docker compose --profile dev up --build       → http://127.0.0.1:5173 (Vite, live reload) + API on :8600
# Ports are published on 127.0.0.1 only (AGENTS rule 1). data/ (DB, snapshots, 3D models) is mounted, never baked in.
# Don't run the native API (`make api`) at the same time: same port, same database.
# `db` (PostgreSQL + pgvector, D-059) has no profile: it starts with either profile and alone via `make db`.
name: sharksight

x-api: &api
  env_file:
    - path: .env
      required: false
  environment: &api-env
    # inside the compose network the database is `db:5432` (the host's 127.0.0.1:5433 is for native runs)
    DATABASE_URL: postgresql://sharksight_app:${APP_DB_PASSWORD}@db:5432/sharksight
    MIGRATION_DATABASE_URL: postgresql://sharksight:${POSTGRES_PASSWORD}@db:5432/sharksight
    APP_DB_PASSWORD: ${APP_DB_PASSWORD}
  ports:
    - "127.0.0.1:8600:8600"
  depends_on:
    db: { condition: service_healthy }

services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: sharksight
      POSTGRES_DB: sharksight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # byte/code-point text order, exactly like SQLite (D-059): ORDER BY and < > on text behave as before;
      # the builtin provider doesn't depend on the OS locale data
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"   # 5433: 5432 is often taken by another local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharksight -d sharksight"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    <<: *api
    profiles: [prod]
    build: { context: ., target: prod }
    image: sharksight:prod
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  api-dev:
    <<: *api
    profiles: [dev]
    build: { context: ., target: dev }
    image: sharksight:dev
    environment:
      <<: *api-env
      APP_ENV: development
    volumes:
      - ./data:/app/data
      - ./backend/src:/app/backend/src
      - ./backend/scripts:/app/backend/scripts
      - ./backend/migrations:/app/backend/migrations
      - ./research:/app/research:ro

  web-dev:
    profiles: [dev]
    image: node:22-slim
    working_dir: /app/frontend
    command: sh -c "npm ci && npx vite --strictPort"
    environment:
      API_URL: http://api-dev:8600
      VITE_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules   # container's own (Linux) node_modules, not the host's macOS ones
    depends_on:
      api-dev: { condition: service_healthy }

volumes:
  pgdata:

[project]
name = "bmw-req"
version = "0.1.0"
description = "AI-assisted, evidence-linked customer requirements for BMW successor vehicles (hackathon)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai",
    "langgraph",
    "sqlite-vec",
    "streamlit",
    "pydantic",
    "python-dotenv",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.9.1",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
successor = "api.main:run"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# editable installs put both src/ (bmw_req) and the repo root (api) on sys.path
dev-mode-dirs = ["src", "."]

[tool.hatch.build.targets.wheel]
packages = ["src/bmw_req", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

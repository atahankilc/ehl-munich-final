[theme]
base = "light"
primaryColor = "#1c69d4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"
textColor = "#1d2733"
font = "sans-serif"
baseRadius = "small"
borderColor = "#dde2e8"

[server]
runOnSave = false
# confidential BMW data (AGENTS rule 1): serve on this machine only, not on the LAN/internet
address = "localhost"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
